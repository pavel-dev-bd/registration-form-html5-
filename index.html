    <style>
        /* CSS for a modern, responsive, and accessible design */
        :root {
            --primary-color: #007bff; /* Blue */
            --secondary-color: #6c757d; /* Gray */
            --danger-color: #dc3545; /* Red for required */
            --background-color: #f8f9fa;
            --card-background: #ffffff;
            --border-color: #ced4da;
            --focus-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background-color);
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        .container {
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 5px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            font-size: 24px;
        }

        .info {
            text-align: center;
            color: var(--secondary-color);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap; 
            gap: 30px;
        }

        .form-column {
            flex: 1 1 45%; 
            min-width: 300px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: #343a40;
            font-size: 14px;
        }

        label span.required {
            color: var(--danger-color);
            margin-left: 2px;
        }

        small {
            font-size: 12px;
            color: var(--secondary-color);
            display: block;
            margin-top: 5px;
        }

        /* Standard Input/Select Styling */
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px; 
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: var(--focus-shadow);
        }

        /* Styling for File Input Group */
        .file-input-group input[type="file"] {
            display: block; /* Ensures it takes up full width in its container */
            margin-top: 5px;
        }

        .file-info {
            font-size: 12px;
            color: var(--secondary-color);
            margin-top: 5px;
        }

        .date-group {
            display: flex;
            gap: 10px;
        }

        .date-group select {
            flex: 1;
        }

        /* Radio/Checkbox Accessibility */
        .radio-group-options {
            display: flex; /* Arranges radio options in a row */
            gap: 20px;
            align-items: center;
            margin-top: 5px;
        }

        .radio-group-options label {
            display: inline; /* Makes the text inline with the radio button */
            margin-right: 0;
            font-weight: normal;
            margin-bottom: 0;
        }
        
        .radio-group-options input[type="radio"] {
            margin-right: 5px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            background-color: #0056b3;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .form-row {
                gap: 0; 
            }
            .form-column {
                flex: 1 1 100%; 
                min-width: 100%;
            }
            .container {
                padding: 20px 15px;
            }
        }
    </style>
</head>
